; diablo1-4k display profile: 1920x1080 game, x3 on a 5K Retina iMac
;
; Display: 5K iMac with System Settings > Displays set to "looks like 2880 x 1620".
; macOS then renders 5760 x 3240 pixels, and 1920 x 1080 fills them exactly:
; every game pixel becomes 3 x 3 screen pixels, crisp, with no borders.
; Full HD: the original look at today's sizes. Recommended.
; At the default "looks like 2560 x 1440" (5120 x 2880 pixels) the factor is
; smaller and black borders appear. Pick a resolution marked "(x2)", "(x4)" etc.
; in Settings > Graphics > Resolution instead.
;
; Apply:  scripts/run.sh --profile 1080p-x3
; Values: booleans are 0 or 1 only; anything else stops the game with an error.

[Graphics]
Width=1920
Height=1080
Fullscreen=1
; Upscale: render at Width x Height and scale to the screen.
Upscale=1
; Fit to Screen=0 keeps Width x Height as written (no aspect-ratio adjustment).
Fit to Screen=0
Integer Scaling=1
; 0 = nearest pixel: sharp pixels, no blur.
Scaling Quality=0
; Zoom=1 would magnify the world another 2x (less of the map on screen).
Zoom=0
; The mouse cursor is scaled x3 as well; cursors larger than this
; maximum fall back to slower software drawing.
Hardware Cursor Maximum Size=512
