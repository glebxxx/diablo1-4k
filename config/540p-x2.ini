; diablo1-4k display profile: 960x540 game, x2 on an external 1080p monitor
;
; Display: a regular (non-Retina) 1920 x 1080 monitor. 960 x 540 fills it
; exactly: every game pixel becomes 2 x 2 screen pixels, crisp, with no borders.
; The game picks the scale factor from the display it opens on; on the 5K iMac
; the same settings give x6 (see 540p-x6.ini).
;
; Apply:  scripts/run.sh --profile 540p-x2
; Values: booleans are 0 or 1 only; anything else stops the game with an error.

[Graphics]
Width=960
Height=540
Fullscreen=1
; Upscale: render at Width x Height and scale to the screen.
Upscale=1
; Fit to Screen=0 keeps Width x Height as written (no aspect-ratio adjustment).
Fit to Screen=0
Integer Scaling=1
; 0 = nearest pixel: sharp pixels, no blur.
Scaling Quality=0
; Zoom=1 would magnify the world another 2x (less of the map on screen).
Zoom=0
Hardware Cursor Maximum Size=128
