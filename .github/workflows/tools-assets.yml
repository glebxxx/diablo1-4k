name: tools/assets (Python)

on:
  push:
    branches: [main]
    paths:
      - "tools/assets/**"
      - ".github/workflows/tools-assets.yml"
  pull_request:
    paths:
      - "tools/assets/**"
      - ".github/workflows/tools-assets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.12" }
    defaults:
      run:
        working-directory: tools/assets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Mypy
        run: mypy

      # Shareware data for the optional real-format tests, fetched exactly like upstream CI.
      # It lives outside the checkout and is never committed.
      - name: Download spawn.mpq
        run: curl -sSfL -o "$RUNNER_TEMP/spawn.mpq" https://github.com/diasurgical/devilutionx-assets/releases/download/v2/spawn.mpq

      - name: Pytest
        env:
          HYPOTHESIS_PROFILE: ci
        run: D1ASSETS_SPAWN_MPQ="$RUNNER_TEMP/spawn.mpq" python -m pytest -ra
